# v1 tank-side ESP32: two XKC-Y25V non-contact level sensors, one at the
# 100% mark of each tank. "on" (wet) means the tank is full.
#
# Entity names are kept exactly as they were deployed so the Node-RED flow's
# entity IDs (binary_sensor.esp32_tank_tank_0_sensor, ...) keep working.
# Which physical tank each pin watches was not recorded; see ../README.md.

esphome:
  name: esp32-tank

esp32:
  board: esp32dev
  framework:
    type: esp-idf

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO27
      mode: input
      inverted: true
    name: "Tank 0 Sensor"
    id: tank_0_full
    device_class: moisture
    filters:
      # Ignore splashes and ripples so the "not on for N min" timers in
      # Node-RED aren't reset by a momentary flicker.
      - delayed_on: 3s
      - delayed_off: 10s

  - platform: gpio
    pin:
      number: GPIO26
      mode: input
      inverted: true
    name: "Tank 1&2"
    id: tank_1_2_full
    device_class: moisture
    filters:
      - delayed_on: 3s
      - delayed_off: 10s

wifi:
  ssid: !secret tank_wifi_ssid
  password: !secret wifi_password
  use_address: 192.168.0.198
  fast_connect: true
  output_power: 8.5
  power_save_mode: none
  # Fallback hotspot (captive portal) in case the Wi-Fi connection fails
  ap:
    ssid: "Tank ESP Fallback Hotspot"
    password: !secret fallback_ap_password

captive_portal:

logger:

api:
  encryption:
    key: !secret api_encryption_key_tank

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  auth:
    username: !secret web_username
    password: !secret web_password
